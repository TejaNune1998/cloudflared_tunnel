services:
  tunnel:
    container_name: cloudflared-tunnel
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    networks:
      - proxy
    environment:
      - TUNNEL_TOKEN=</YOUR_TOKEN>
    dns:
      - 1.1.1.1
      - 8.8.8.8
networks:
  proxy:
    external: true
